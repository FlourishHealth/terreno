url: http://localhost:8082/
---
# Create a todo after login flow (same Maestro session — user is already signed in)
# Prerequisites: login.yaml ran first in executionOrder

- launchApp

- extendedWaitUntil:
    visible:
      id: "todos-screen"
    timeout: 30000

# RN Web: Maestro matches LoginScreen via nativeID (TextField id prop)
- extendedWaitUntil:
    visible:
      id: "todos-title-input"
    timeout: 30000

- tapOn:
    id: "todos-title-input"
- inputText: "Buy groceries"

- tapOn:
    id: "Add Todo"

- extendedWaitUntil:
    visible: "Buy groceries"
    timeout: 30000
