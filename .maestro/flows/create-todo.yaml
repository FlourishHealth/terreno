url: http://localhost:8082/login
---
# Login and create a todo
# Prerequisites: backend running on port 4000, test data seeded, frontend running on port 8082

- launchApp

- extendedWaitUntil:
    visible:
      id: "login-screen-email-input"
    timeout: 60000

- tapOn:
    id: "login-screen-email-input"
- inputText: "admin@example.com"

- tapOn:
    id: "login-screen-password-input"
- inputText: "testpassword123"

- tapOn:
    id: "login-screen-submit-button"

- extendedWaitUntil:
    visible:
      id: "todos-screen"
    timeout: 30000

- tapOn:
    id: "todos-title-input"
- inputText: "Buy groceries"

- tapOn:
    id: "todos-create-button"

- extendedWaitUntil:
    visible: "Buy groceries"
    timeout: 10000
