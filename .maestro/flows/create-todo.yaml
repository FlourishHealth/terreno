url: http://localhost:8082/login
---
# Login and create a todo
# Prerequisites: backend running on port 4000, test data seeded, frontend running on port 8082

- launchApp

# Wait for the login screen
- extendedWaitUntil:
    visible: "Log In"
    timeout: 60000

# Login first
- tapOn: "Email"
- inputText: "admin@example.com"

- tapOn: "Password"
- inputText: "testpassword123"

- tapOn: "Log In"

# Wait for Todos screen
- extendedWaitUntil:
    visible: "My Todos"
    timeout: 30000

# Create a new todo
- tapOn: "What needs to be done?"
- inputText: "Buy groceries"

- tapOn: "Add Todo"

# Assert the todo appears in the list
- extendedWaitUntil:
    visible: "Buy groceries"
    timeout: 10000
