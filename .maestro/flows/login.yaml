url: http://localhost:8082/login
---
# Login with the seeded non-admin user. Admin shows Sync Lab / SyncDevPanel,
# which pushes the first todo off-screen inside FlashList on Maestro's viewport.
# Prerequisites: backend running on port 4000, test data seeded, frontend running on port 8082

- launchApp

- extendedWaitUntil:
    visible:
      id: "login-screen-email-input"
    timeout: 60000

- tapOn:
    id: "login-screen-email-input"
- inputText: "test@example.com"

- tapOn:
    id: "login-screen-password-input"
- inputText: "testpassword123"

- tapOn:
    id: "Log In"

- extendedWaitUntil:
    visible:
      id: "todos-screen"
    timeout: 30000
