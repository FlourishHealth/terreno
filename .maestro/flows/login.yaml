url: http://localhost:8082/login
---
# Login with existing test user
# Prerequisites: backend running on port 4000, test data seeded, frontend running on port 8082

- launchApp

# Wait for the login screen (text selectors — testID/id are unreliable on RN Web)
- extendedWaitUntil:
    visible: "Log In"
    timeout: 60000

# Fill in email
- tapOn: "Email"
- inputText: "admin@example.com"

# Fill in password
- tapOn: "Password"
- inputText: "testpassword123"

# Submit login
- tapOn: "Log In"

# Assert navigation to Todos screen
- extendedWaitUntil:
    visible: "My Todos"
    timeout: 30000
