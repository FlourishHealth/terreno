title: "[Hacktoberfest]: "
labels: ["hacktoberfest"]
body:
  - type: markdown
    attributes:
      value: |
        Pitch something you'd like to build (or see built) during Hacktoberfest.
        Upvote the ideas you want most — maintainers turn the popular, well-scoped
        ones into issues labeled `hacktoberfest` that anyone can pick up.

        Longer-term feature ideas belong in [Ideas](https://github.com/TerrenoLabs/terreno/discussions/categories/ideas).

  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you build, and who benefits?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Matches the Area field on the Terreno Roadmap board
      options:
        - api
        - ui
        - syncdb
        - auth
        - admin
        - ai
        - mcp
        - docs
        - deploy
        - examples
        - dx
        - not sure
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: Rough size
      options:
        - Small — a few hours, good first contribution
        - Medium — a weekend
        - Large — needs splitting into several issues
        - Not sure
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: What "done" looks like
      description: Acceptance criteria, screenshots, or the docs page that would change

  - type: checkboxes
    id: build
    attributes:
      label: Who builds it
      options:
        - label: I want to build this myself
        - label: I'd pair with or mentor someone who picks it up
