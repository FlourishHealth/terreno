name: API CI

# Disabled after migration to CircleCI; retained for rollback.
on:
  push:
    branches-ignore:
      - "**"

defaults:
  run:
    working-directory: api

jobs:
  test:
    name: Run all tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mongodb-version: ["6.0"]
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Setup Bun workspace
        uses: ./.github/actions/setup-bun-workspace

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: ${{ matrix.mongodb-version }}
          mongodb-image: mirror.gcr.io/library/mongo

      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run compile
      - name: Test with coverage threshold
        run: bun run test:coverage
        env:
          CI: true
