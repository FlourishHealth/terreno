name: Sync roadmap board

# Pushes the repository's roadmap taxonomy onto GitHub: the label set, the
# Terreno Roadmap project's fields and options, and one board item per roadmap
# entry. Runs automatically when the source-of-truth files change, and on
# demand for the one-off cases (opening a tracking issue for a newly approved IP).
#
# The reverse direction lives in roadmap-generate.yml, which renders the board
# back into ROADMAP.md.

on:
  push:
    branches: [master]
    paths:
      - ".github/labels.yml"
      - ".github/roadmap-fields.yml"
      - "docs/explanation/roadmap-seed-issues.md"
      - "scripts/roadmap/**"
      - "scripts/sync-labels.ts"
  workflow_dispatch:
    inputs:
      create_missing_issues:
        description: "Open tracking issues for entries whose IP now exists"
        type: boolean
        default: false
      dry_run:
        description: "Print the plan without changing anything"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: roadmap-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Reconcile labels and project board
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Validate required secrets
        env:
          # Needs `project` (read+write) plus `public_repo`. The default
          # GITHUB_TOKEN cannot touch ProjectV2 at all, and GitHub reserves that
          # name, so the PAT ships under its own key.
          ROADMAP_PROJECT_TOKEN: ${{ secrets.ROADMAP_PROJECT_TOKEN }}
        run: |
          missing=()
          if [ -z "$ROADMAP_PROJECT_TOKEN" ]; then missing+=("ROADMAP_PROJECT_TOKEN"); fi
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync labels
        env:
          GH_TOKEN: ${{ secrets.ROADMAP_PROJECT_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            bun run labels:sync --repo "$GITHUB_REPOSITORY" --dry-run
          else
            bun run labels:sync --repo "$GITHUB_REPOSITORY"
          fi

      - name: Sync project board
        env:
          # The script calls the GraphQL API with GITHUB_TOKEN and shells out to
          # `gh` for issue labels, which reads GH_TOKEN — same PAT for both.
          GH_TOKEN: ${{ secrets.ROADMAP_PROJECT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.ROADMAP_PROJECT_TOKEN }}
        run: |
          args=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then args+=(--dry-run); fi
          if [ "${{ inputs.create_missing_issues }}" = "true" ]; then args+=(--create-missing-issues); fi
          bun run roadmap:sync "${args[@]}"
