name: Docs Deploy

on:
  push:
    branches:
      - master
    paths:
      - "docs/**"
      - "website/**"
      - "api/src/**"
      - "rtk/src/**"
      - "demo/demoConfig.tsx"
      - "demo/story-config/**"
      - "ui/src/**"
      - ".github/workflows/docs-deploy.yml"
      - "netlify.toml"
  pull_request:
    paths:
      - "docs/**"
      - "website/**"
      - "api/src/**"
      - "rtk/src/**"
      - "demo/demoConfig.tsx"
      - "demo/story-config/**"
      - "ui/src/**"
      - ".github/workflows/docs-deploy.yml"
      - "netlify.toml"

jobs:
  check-changes:
    name: Check for relevant changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v6

      - name: Check PR diff for docs-relevant changes
        id: check
        run: |
          FILES=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename')
          CHANGES=$(echo "$FILES" | grep -cE '^(docs/|website/|api/src/|rtk/src/|demo/demoConfig\.tsx|demo/story-config/|ui/src/|netlify\.toml)' || true)
          echo "has_changes=$( [ "$CHANGES" -gt 0 ] && echo true || echo false )" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    name: Build docs site
    needs: [check-changes]
    if: always() && (github.event_name == 'push' || needs.check-changes.outputs.has_changes == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Cache only Bun's global download cache, not node_modules. Restoring a stale
      # node_modules across lockfile changes can leave extraneous packages (e.g. an old
      # TypeScript) that a frozen install won't prune, which broke typedoc's TypeScript
      # resolution. A clean node_modules per run keeps the installed tree deterministic.
      - name: Cache bun download cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
          key: bun-docs-v2-${{ runner.os }}-${{ hashFiles('bun.lock', 'website/package.json') }}
          restore-keys: |
            bun-docs-v2-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache generated API reference
        id: api-ref-cache
        uses: actions/cache@v6
        with:
          path: docs/reference/generated
          key: docs-api-ref-${{ hashFiles('api/src/**', 'rtk/src/**', 'website/scripts/generate-api-reference.ts') }}

      - name: Cache generated UI component docs
        id: ui-docs-cache
        uses: actions/cache@v6
        with:
          path: |
            demo/ui-types-documentation.json
            docs/reference/components
          key: docs-ui-ref-${{ hashFiles('ui/src/**', 'demo/demoConfig.tsx', 'demo/story-config/**', 'website/scripts/generate-component-docs.ts') }}

      - name: Compile UI package
        if: steps.ui-docs-cache.outputs.cache-hit != 'true'
        run: bun run compile
        working-directory: ui

      - name: Generate UI type documentation
        if: steps.ui-docs-cache.outputs.cache-hit != 'true'
        run: bun run types
        working-directory: ui

      - name: Generate component docs
        if: steps.ui-docs-cache.outputs.cache-hit != 'true'
        run: bun run generate:components
        working-directory: website

      - name: Generate API reference
        if: steps.api-ref-cache.outputs.cache-hit != 'true'
        run: bun run generate:api
        working-directory: website

      # Rspack/webpack incremental cache. Preview vs production configs differ
      # (versioning, minify, search), so the key includes event_name.
      - name: Cache Docusaurus build cache
        uses: actions/cache@v6
        with:
          path: website/.docusaurus
          key: docusaurus-v1-${{ runner.os }}-${{ github.event_name }}-${{ hashFiles('bun.lock', 'website/docusaurus.config.ts', 'website/package.json') }}
          restore-keys: |
            docusaurus-v1-${{ runner.os }}-${{ github.event_name }}-

      - name: Build docs site
        run: bunx docusaurus build ${{ github.event_name == 'pull_request' && '--no-minify' || '' }}
        working-directory: website
        env:
          DEMO_URL: https://terreno-demo.netlify.app
          DOCS_PREVIEW: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: docs-dist
          path: website/build
          retention-days: 1

  deploy-production:
    name: Deploy docs to production
    needs: build
    # `always()` is required because `build` needs `check-changes`, which is skipped on
    # push events — that skip otherwise propagates down the dependency chain and
    # silently skips this job even when `build` itself succeeded.
    if: always() && needs.build.result == 'success' && github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      statuses: write
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Validate required secrets
        run: |
          missing=()
          if [ -z "${{ secrets.NETLIFY_AUTH_TOKEN }}" ]; then missing+=("NETLIFY_AUTH_TOKEN"); fi
          if [ -z "${{ secrets.NETLIFY_DOCS_SITE_ID }}" ]; then missing+=("NETLIFY_DOCS_SITE_ID"); fi
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Download build artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: docs-dist
          path: dist

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v4.0
        with:
          publish-dir: "./dist"
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Docs deploy from GitHub Actions"
          enable-pull-request-comment: false
          enable-commit-comment: false
          enable-github-deployment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_DOCS_SITE_ID }}
        timeout-minutes: 5

  deploy-preview:
    name: Deploy docs preview
    needs: build
    # See note on deploy-production above about why `always()` is required.
    if: always() && needs.build.result == 'success' && github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment:
      name: docs-preview-pr-${{ github.event.pull_request.number }}
      url: ${{ steps.netlify.outputs.deploy-url }}
    permissions:
      contents: read
      deployments: write
      statuses: write
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Validate required secrets
        run: |
          missing=()
          if [ -z "${{ secrets.NETLIFY_AUTH_TOKEN }}" ]; then missing+=("NETLIFY_AUTH_TOKEN"); fi
          if [ -z "${{ secrets.NETLIFY_DOCS_SITE_ID }}" ]; then missing+=("NETLIFY_DOCS_SITE_ID"); fi
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Download build artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: docs-dist
          path: dist

      - name: Deploy to Netlify
        id: netlify
        uses: nwtgck/actions-netlify@v4.0
        with:
          publish-dir: "./dist"
          production-deploy: false
          alias: docs-pr-${{ github.event.pull_request.number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Docs preview for PR #${{ github.event.pull_request.number }}"
          enable-pull-request-comment: false
          enable-commit-comment: false
          enable-github-deployment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_DOCS_SITE_ID }}
        timeout-minutes: 5
