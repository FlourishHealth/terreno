name: Repository policies

on:
  push:
    branches:
      - master
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/package.json"
      - "LICENSE"
      - "**/LICENSE"
      - "biome/plugins/no-barrel-imports.grit"
      - "scripts/no-barrel-imports/**"
      - "scripts/check-explicit-any/**"
      - "scripts/check-source-rules/**"
      - "scripts/check-license-coverage/**"
      - "scripts/changelog/**"
      - "changelog/**"
      - "CHANGELOG.md"
      - "scripts/check-circleci-parity/**"
      - "scripts/planning/**"
      - "plugins/**"
      - ".cursor-plugin/**"
      - ".rulesync/skills/**"
      - "skills/**"
      - "skills.sh.json"
      - "**/.ai/skills/**"
      - "docs/explanation/no-barrel-imports.md"
      - "docs/explanation/explicit-any-policy.md"
      - "docs/explanation/source-rules.md"
      - ".circleci/**"
      - ".github/workflows/repo-policies.yml"
  pull_request:
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/package.json"
      - "LICENSE"
      - "**/LICENSE"
      - "biome/plugins/no-barrel-imports.grit"
      - "scripts/no-barrel-imports/**"
      - "scripts/check-explicit-any/**"
      - "scripts/check-source-rules/**"
      - "scripts/check-license-coverage/**"
      - "scripts/changelog/**"
      - "changelog/**"
      - "CHANGELOG.md"
      - "scripts/check-circleci-parity/**"
      - "scripts/planning/**"
      - "plugins/**"
      - ".cursor-plugin/**"
      - ".rulesync/skills/**"
      - "skills/**"
      - "skills.sh.json"
      - "**/.ai/skills/**"
      - "docs/explanation/no-barrel-imports.md"
      - "docs/explanation/explicit-any-policy.md"
      - "docs/explanation/source-rules.md"
      - ".circleci/**"
      - ".github/workflows/repo-policies.yml"

jobs:
  no-barrel-imports:
    name: No barrel imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate required secrets
        run: |
          missing=()
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Check for barrel imports
        run: bun run check:no-barrel-imports

  source-rules:
    name: Production source rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate required secrets
        run: |
          missing=()
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Install workspace dependencies
        run: bun install

      - name: Check production source rules
        run: bun run check:source-rules

      - name: Test source-rules scanner
        run: bun test scripts/check-source-rules/

  explicit-any:
    name: Explicit any baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate required secrets
        run: |
          missing=()
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Install workspace dependencies
        run: bun install

      - name: Check explicit any baseline
        run: bun run check:explicit-any:baseline

      - name: Write explicit any inventory artifact
        if: always()
        run: bun run check:explicit-any:json > explicit-any-inventory.json

      - name: Upload explicit any inventory
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: explicit-any-inventory
          path: explicit-any-inventory.json

  circleci-parity:
    name: CircleCI path-filter parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate required secrets
        run: |
          missing=()
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Check CircleCI path filters match GHA twins
        run: bun run check:circleci-parity

  license-coverage:
    name: License coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate required secrets
        run: |
          missing=()
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Check published package license coverage
        run: bun run check:licenses

  changelog-fragments:
    name: Changelog fragments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate required secrets
        run: |
          missing=()
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Install workspace dependencies
        run: bun install

      - name: Check changelog fragments
        run: bun run check:changelog

      - name: Test changelog assemble
        run: bun test scripts/changelog/lib.test.ts

  lifecycle-skills:
    name: Lifecycle skill architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate required secrets
        run: |
          missing=()
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Install workspace dependencies
        run: bun install

      - name: Check lifecycle contracts
        run: bun run check:lifecycle-skills

      - name: Test lifecycle validator
        run: bun test scripts/planning/
