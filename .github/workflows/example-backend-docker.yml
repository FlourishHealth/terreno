name: Example Backend Docker Build

on:
  pull_request:
    paths:
      - "example-backend/**"
      - "api/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/example-backend-docker.yml"

jobs:
  build-image:
    name: Build backend Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Validate required inputs
        run: |
          missing=()
          if [ -z "${{ github.event.pull_request.number }}" ]; then
            missing+=("pull_request context")
          fi
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required inputs: ${missing[*]}"
            exit 1
          fi

      - uses: actions/checkout@v6.0.3

      # CD already builds this image for preview deploy when api/example-backend
      # source changes. Rebuild here only when the image recipe itself changed.
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            image_recipe:
              - "example-backend/Dockerfile"
              - "example-backend/.dockerignore"
              - "example-backend/package.json"
              - "package.json"
              - "bun.lock"
              - ".github/workflows/example-backend-docker.yml"

      - name: Skip duplicate image build
        if: steps.filter.outputs.image_recipe != 'true'
        run: echo "Image recipe unchanged; CD preview deploy builds the backend image."

      - name: Set up Docker Buildx
        if: steps.filter.outputs.image_recipe == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build image
        if: steps.filter.outputs.image_recipe == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: example-backend/Dockerfile
          push: false
          # Buildx already proves the image compiles; loading into the local
          # daemon (~1–2 extra minutes) is only needed if a later step runs it.
          load: false
          tags: terreno-example-backend:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
