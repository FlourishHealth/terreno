name: Example Backend Docker Build

on:
  pull_request:
    paths:
      - "example-backend/**"
      - "api/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/example-backend-docker.yml"

jobs:
  build-image:
    name: Build backend Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Validate required inputs
        run: |
          missing=()
          if [ -z "${{ github.event.pull_request.number }}" ]; then
            missing+=("pull_request context")
          fi
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required inputs: ${missing[*]}"
            exit 1
          fi

      - uses: actions/checkout@v6.0.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: example-backend/Dockerfile
          push: false
          load: true
          tags: terreno-example-backend:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
