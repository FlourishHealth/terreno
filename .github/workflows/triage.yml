name: Issue triage

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  triage:
    name: Apply triage labels
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        run: |
          missing=()
          if [ -z "${{ secrets.GITHUB_TOKEN }}" ]; then missing+=("GITHUB_TOKEN"); fi
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - uses: actions/checkout@v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Resolve the area label from the shared table in scripts/issueAreaLabels.ts
      # so the workflow and its tests cannot disagree about the mapping.
      - name: Resolve area label
        id: area
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: bun run scripts/issueAreaLabels.ts

      - uses: actions/github-script@v7
        env:
          AREA_LABEL: ${{ steps.area.outputs.area }}
        with:
          script: |
            const issue = context.payload.issue;

            const labels = ["status:needs-triage"];
            const areaLabel = process.env.AREA_LABEL ?? "";
            if (areaLabel) {
              labels.push(areaLabel);
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels,
            });

            if (!areaLabel) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body:
                  "Thanks for opening this issue. We could not infer an `area:*` label from the template — please mention the affected package or area (`api`, `ui`, `docs`, etc.) so maintainers can triage it onto the roadmap.",
              });
            }
