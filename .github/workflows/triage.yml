name: Issue triage

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  triage:
    name: Apply triage labels
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        run: |
          missing=()
          if [ -z "${{ secrets.GITHUB_TOKEN }}" ]; then missing+=("GITHUB_TOKEN"); fi
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body ?? "";

            const packageMatch = body.match(/### Affected package\s*\n+([^\n#]+)/i);
            const packageValue = packageMatch?.[1]?.trim() ?? "";

            const areaByPackage = {
              "@terreno/api": "area:api",
              "@terreno/test": "area:api",
              "@terreno/ui": "area:ui",
              "@terreno/rtk": "area:syncdb",
              "@terreno/admin-backend": "area:admin",
              "@terreno/admin-frontend": "area:admin",
              "@terreno/admin-spa": "area:admin",
              "@terreno/ai": "area:ai",
              "@terreno/api-health": "area:api",
              "@terreno/feature-flags": "area:api",
              "@terreno/mcp": "area:mcp",
              docs: "area:docs",
              examples: "area:examples",
              mcp: "area:mcp",
            };

            const labels = ["status:needs-triage"];
            const areaLabel = areaByPackage[packageValue];
            if (areaLabel) {
              labels.push(areaLabel);
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels,
            });

            if (!areaLabel) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body:
                  "Thanks for opening this issue. We could not infer an `area:*` label from the template — please mention the affected package or area (`api`, `ui`, `docs`, etc.) so maintainers can triage it onto the roadmap.",
              });
            }
