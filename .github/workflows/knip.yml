name: Knip

on:
  merge_group:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  zero-findings:
    name: Zero findings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Fail on Knip findings
        run: bun run check:knip
