name: create-terreno-app CI

# Disabled after migration to CircleCI; retained for rollback.
on: []

defaults:
  run:
    working-directory: create-terreno-app

jobs:
  test:
    name: Lint, compile, and test create-terreno-app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ github.ref }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ github.ref }}-
            bun-${{ runner.os }}-

      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Compile
        run: bun run compile

      - name: Test
        run: bun run test
        env:
          CI: true
