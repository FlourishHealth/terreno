      - run:
          name: Dispatch EAS development workflow
          command: scripts/ci/eas-dispatch.sh "<< pipeline.parameters.eas-dev-target >>"

  publish-package-manual:
    executor: node22_mongo
    steps:
      - checkout
      - install_bun_and_deps
      - wait_for_mongo
      - run:
          name: Publish selected package
          command: |
            package="<< pipeline.parameters.manual-publish-package >>"
            version="<< pipeline.parameters.manual-publish-version >>"
            if [ "$package" = "none" ]; then
              echo "manual-publish-package is required"
              exit 2
            fi
            scripts/ci/publish-package.sh "$package" "$version" latest manual

  publish-release:
    executor: node22_mongo
    resource_class: large
    steps:
      - checkout
      - install_bun_and_deps
      - wait_for_mongo
      - run:
          name: Validate release tag and upgrade notes
          command: |
            if ! [[ "${CIRCLE_TAG:-}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
              echo "Release requires a semver tag"
              exit 2
            fi
            bun run check:upgrade-docs "$CIRCLE_TAG"
      - run:
          name: Publish packages in dependency order
          command: |
            version="$CIRCLE_TAG"
            if [[ "$version" == *-* ]]; then
              prerelease="${version#*-}"
              npm_tag="${prerelease%%.*}"
            else
              npm_tag=latest
            fi
            packages=(
              api test ui rtk admin-backend admin-frontend admin-spa ai
              api-health comms feature-flags mcp-server syncdb
            )
            for package in "${packages[@]}"; do
              scripts/ci/publish-package.sh "$package" "$version" "$npm_tag" release
            done
      - run:
          name: Update stable package versions on master
          command: |
            if [[ "$CIRCLE_TAG" == *-* ]]; then
              echo "Prerelease: skipping master version bump"
              exit 0
            fi
            scripts/ci/validate-env.sh REPO_ADMIN_TOKEN
            git config user.name "terreno-circleci"
            git config user.email "josh@nang.io"
            git fetch origin master
            git checkout -B release-master origin/master
            for package in api test ui rtk admin-backend admin-frontend admin-spa ai api-health comms feature-flags mcp-server syncdb; do
              [ -d "$package" ] || continue
              node -e "
                const fs=require('fs');
                const path='$package/package.json';
                const pkg=JSON.parse(fs.readFileSync(path,'utf8'));
                pkg.version=process.env.CIRCLE_TAG;
                fs.writeFileSync(path,JSON.stringify(pkg,null,2)+'\\n');
              "
            done
            git add -- '*/package.json'
            if ! git diff --cached --quiet; then
              git commit -m "chore: bump package versions to ${CIRCLE_TAG}"
              git remote set-url origin "https://x-access-token:${REPO_ADMIN_TOKEN}@github.com/FlourishHealth/terreno.git"
              git pull --rebase origin master
              git push origin HEAD:master
            fi
      - run:
          name: Notify release channel
          when: on_success
          command: |
            scripts/ci/validate-env.sh ZOOM_WEBHOOK_TOKEN ZOOM_WEBHOOK_URL
            curl --fail --silent --show-error \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer ${ZOOM_WEBHOOK_TOKEN}" \
              --data "$(jq -n --arg version "$CIRCLE_TAG" '{message:("Terreno release " + $version + " completed in CircleCI")}')" \
              "$ZOOM_WEBHOOK_URL"
      - run:
          name: Notify release channel of failure
          when: on_fail
          command: |
            scripts/ci/validate-env.sh ZOOM_WEBHOOK_TOKEN ZOOM_WEBHOOK_URL
            curl --fail --silent --show-error \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer ${ZOOM_WEBHOOK_TOKEN}" \
              --data "$(jq -n --arg version "$CIRCLE_TAG" '{message:("Terreno release " + $version + " failed in CircleCI")}')" \
              "$ZOOM_WEBHOOK_URL"

workflows:
  # Attach terreno-e2e / terreno-github-api / terreno-agentic in the CircleCI
  # project once Phase 0 contexts exist. Do not put GITHUB_TOKEN or
  # CURSOR_API_KEY in project env vars (injected into every job). Missing named
  # contexts fail the pipeline, so they are not hard-required in this file until
  # created; then attach:
  #   - dco:
  #       context: [terreno-github-api]
  #   - architectural-pr-review:
  #       context: [terreno-github-api, terreno-agentic]
  always:
    jobs:
      - config-ok
      - dco
      - architectural-pr-review

  rulesync:
    when: << pipeline.parameters.run-rulesync >>
    jobs:
      - rulesync-check

  syncdb:
    when: << pipeline.parameters.run-syncdb >>
    jobs:
      - syncdb-ci

  new-file-coverage:
    when: << pipeline.parameters.run-new-file-coverage >>
    jobs:
      - new-file-coverage

  api:
    when: << pipeline.parameters.run-api >>
    jobs:
      - api-ci

  ai:
    when: << pipeline.parameters.run-ai >>
    jobs:
      - ai-ci

  rtk:
    when: << pipeline.parameters.run-rtk >>
    jobs:
      - rtk-ci

  ui:
    when: << pipeline.parameters.run-ui >>
    jobs:
      - ui-ci
      - ui-demo-typecheck

  admin-backend:
    when: << pipeline.parameters.run-admin-backend >>
    jobs:
      - admin-backend-ci

  admin-frontend:
    when: << pipeline.parameters.run-admin-frontend >>
    jobs:
      - admin-frontend-ci

  # Mirror GHA ui-demo-ci: only when demo changed and ui did not.
  ui-demo:
    when:
      and:
        - equal: [true, << pipeline.parameters.run-ui-demo >>]
        - equal: [false, << pipeline.parameters.run-ui >>]
    jobs:
      - ui-demo-ci

  comms:
    when: << pipeline.parameters.run-comms >>
    jobs:
      - comms-ci

  mcp-server:
    when: << pipeline.parameters.run-mcp-server >>
    jobs:
      - mcp-server-ci
      - mcp-server-docker:
          requires:
            - mcp-server-ci

  example-frontend:
    when: << pipeline.parameters.run-example-frontend >>
    jobs:
      - example-frontend-ci

  example-backend:
    when: << pipeline.parameters.run-example-backend >>
    jobs:
      - example-backend-ci

  example-backend-script:
    when: << pipeline.parameters.run-example-backend-script >>
    jobs:
      - example-backend-script-runner

  example-backend-docker:
    when: << pipeline.parameters.run-example-backend-docker >>
    jobs:
      - example-backend-docker

  admin-spa:
    when: << pipeline.parameters.run-admin-spa >>
    jobs:
      - admin-spa-ci

  repo-policies:
    when: << pipeline.parameters.run-repo-policies >>
    jobs:
      - no-barrel-imports
      - source-rules
      - explicit-any
      - lifecycle-skills
      - license-coverage
      - circleci-parity
      - changelog-fragments

  e2e:
    when: << pipeline.parameters.run-e2e >>
    jobs:
      - e2e-prepare
      # One shard per spec file. Keep this list in sync with example-frontend/e2e/
      # (and .github/workflows/e2e-ci.yml while dual-running).
      - e2e:
          requires:
            - e2e-prepare
          matrix:
            parameters:
              spec:
                - login
                - signup
                - todos
                - profile
                - admin
                - admin-home
                - admin-form
                - admin-table-search-filter
                - admin-table-bulk-actions
                - admin-custom-screens
                - admin-comms-back
                - consents
                - ai-chat
                - realtime
                - syncdb-load-delta
                - syncdb-offline
                - syncdb-conflicts
                - syncdb-storage
                - syncdb-chaos

  # Started when setup continues with {"e2e-load": true} after a
  # {"run-e2e-load": true} setup-pipeline trigger.
  e2e-load:
    when: << pipeline.parameters.e2e-load >>
    jobs:
      - e2e-prepare
      - e2e-load:
          requires:
            - e2e-prepare

  admin-spa-integration:
    when: << pipeline.parameters.run-admin-spa-integration >>
    jobs:
      - admin-spa-integration

  maestro:
    when: << pipeline.parameters.run-maestro >>
    jobs:
      - maestro-e2e:
          include-demo: << pipeline.parameters.run-maestro-demo >>

  # Path-filter `run-circleci-config` is set for `.circleci/**`. On config-only
  # PRs, dual-run the documented representative slice (not every ported job).
  # Skip this workflow when path filters already started the heavy package/e2e
  # twins so a mixed PR does not pay for a second api/ui/e2e/mcp matrix.
  circleci-config:
    when:
      and:
        - equal: [true, << pipeline.parameters.run-circleci-config >>]
        - equal: [false, << pipeline.parameters.run-api >>]
        - equal: [false, << pipeline.parameters.run-ui >>]
        - equal: [false, << pipeline.parameters.run-e2e >>]
        - equal: [false, << pipeline.parameters.run-example-backend >>]
        - equal: [false, << pipeline.parameters.run-admin-spa >>]
    jobs:
      - api-ci
      - ui-ci
      - example-backend-ci
      - no-barrel-imports
      - source-rules
      - e2e-prepare
      - e2e:
          requires:
            - e2e-prepare
          matrix:
            parameters:
              spec:
                - login

  deploy-demo-production:
    when:
      and:
        - << pipeline.parameters.run-deploy-demo >>
        - equal: [master, << pipeline.git.branch >>]
    jobs:
      - deploy-demo:
          context: [terreno-netlify]
          filters:
            branches:
              only: master
            tags:
              ignore: /.*/

  deploy-frontend-production:
    when:
      and:
        - << pipeline.parameters.run-deploy-frontend >>
        - equal: [master, << pipeline.git.branch >>]
    jobs:
      - deploy-frontend:
          context: [terreno-netlify]
          filters:
            branches:
              only: master
            tags:
              ignore: /.*/

  deploy-docs-production:
    when:
      and:
        - << pipeline.parameters.run-deploy-docs >>
        - equal: [master, << pipeline.git.branch >>]
    jobs:
      - deploy-docs:
          context: [terreno-netlify]
          filters:
            branches:
              only: master
            tags:
              ignore: /.*/

  gcp-production:
    when:
      and:
        - equal: [master, << pipeline.git.branch >>]
        - or:
            - << pipeline.parameters.run-cd-terraform >>
            - << pipeline.parameters.run-cd-backend >>
            - << pipeline.parameters.run-cd-mcp >>
            - << pipeline.parameters.force-cd >>
    jobs:
      - gcp-cd-prod:
          context: [terreno-gcp]
          filters:
            branches:
              only: master
            tags:
              ignore: /.*/

  deploy-demo-preview:
    when: << pipeline.parameters.run-deploy-demo >>
    jobs:
      - deploy-demo-preview:
          context: [terreno-netlify]
          filters:
            branches:
              ignore: master
            tags:
              ignore: /.*/

  deploy-frontend-preview:
    when: << pipeline.parameters.run-deploy-frontend >>
    jobs:
      - deploy-frontend-preview:
          context: [terreno-netlify]
          filters:
            branches:
              ignore: master
            tags:
              ignore: /.*/

  deploy-docs-preview:
    when: << pipeline.parameters.run-deploy-docs >>
    jobs:
      - deploy-docs-preview:
          context: [terreno-netlify]
          filters:
            branches:
              ignore: master
            tags:
              ignore: /.*/

  gcp-preview:
    when:
      or:
        - << pipeline.parameters.run-cd-terraform >>
        - << pipeline.parameters.run-cd-backend >>
    jobs:
      - gcp-cd-preview:
          context: [terreno-gcp]
          filters:
            branches:
              ignore: master
            tags:
              ignore: /.*/

  deploy-demo-manual:
    when: << pipeline.parameters.force-demo-deploy >>
    jobs:
      - deploy-demo:
          context: [terreno-netlify]

  deploy-preview-manual:
    when:
      not:
        equal: ["", << pipeline.parameters.deploy-preview-pr >>]
    jobs:
      - deploy-preview-manual:
          context: [terreno-gcp, terreno-netlify]

  preview-cleanup-manual:
    when:
      not:
        equal: ["", << pipeline.parameters.preview-cleanup-pr >>]
    jobs:
      - preview-cleanup:
          context: [terreno-gcp]

  eas-dev-manual:
    when:
      not:
        equal: ["none", << pipeline.parameters.eas-dev-target >>]
    jobs:
      - eas-dev-build:
          context: [terreno-expo]

  publish-package-manual:
    when:
      not:
        equal: ["none", << pipeline.parameters.manual-publish-package >>]
    jobs:
      - publish-package-manual:
          context: [terreno-npm]

  publish-release:
    jobs:
      - publish-release:
          context: [terreno-npm, terreno-release]
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$/
      - deploy-demo:
          context: [terreno-netlify]
          requires:
            - publish-release
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^[0-9]+\.[0-9]+\.[0-9]+$/
